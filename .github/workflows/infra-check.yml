name: infra check

# Checks the AWS setup on every push: Terraform is valid, the container builds and the app starts in AWS mode.
on:
  push:
    paths: ["infra/**", "Dockerfile", "requirements*.txt", "app.py", "pipeline/**", ".github/workflows/infra-check.yml"]
  pull_request:

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Format (informational)
        run: terraform fmt -check -recursive -diff
        continue-on-error: true
      - run: terraform init -backend=false
      - run: terraform validate

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t lextreerag:check .
      - name: The Bedrock client is in the image
        run: docker run --rm lextreerag:check python -c "from anthropic import AnthropicBedrockMantle; import boto3; print('ok')"
      - name: The app renders in AWS mode
        run: |
          docker run --rm -e AWS_ACCESS_KEY_ID=test -e AWS_SECRET_ACCESS_KEY=test lextreerag:check python -c "
          from streamlit.testing.v1 import AppTest
          at = AppTest.from_file('app.py', default_timeout=120).run()
          assert not at.exception, [e.value for e in at.exception]
          ok = [s.value for s in at.success]
          assert any('Amazon Bedrock' in v for v in ok), ok
          print('AWS mode renders:', ok)
          "
      - name: The server answers its health check
        run: |
          docker run -d --name app -p 8501:8501 lextreerag:check
          for i in $(seq 1 30); do curl -sf http://localhost:8501/_stcore/health && break; sleep 2; done
          curl -sf http://localhost:8501/_stcore/health
          docker logs app | tail -20
